# CNB 流水线：推送标签后，用 CHANGELOG 对应段落自动创建 Release
# 与 GitHub Actions 的发布流程保持一致，两边各自生成一份 Release
$:
  tag_push:
    - name: release
      stages:
        - name: notes
          image: alpine:3.20
          script: |
            set -eu
            VERSION="${CNB_BRANCH#v}"
            echo "tag: ${CNB_BRANCH}  version: ${VERSION}"
            awk -v ver="${VERSION}" '
              $0 ~ "^## " ver "([[:space:]]|$)" { flag = 1; next }
              flag && /^## / { exit }
              flag { print }
            ' CHANGELOG.md > release-notes.md
            if [ ! -s release-notes.md ]; then
              echo "CHANGELOG 中没有 ${VERSION} 段落，改用简单说明"
              printf 'Release %s\n' "${CNB_BRANCH}" > release-notes.md
            fi
            head -20 release-notes.md

        - name: upload
          type: git:release
          options:
            descriptionFromFile: release-notes.md
